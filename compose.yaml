services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    restart: unless-stopped
    environment:
      ENVIRONMENT: production
      APP_URL: ${APP_URL:?APP_URL is required}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      OAUTH_STATE_SECRET: ${OAUTH_STATE_SECRET:?OAUTH_STATE_SECRET is required}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_SAMESITE: ${COOKIE_SAMESITE:-lax}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:?GOOGLE_CLIENT_ID is required}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:?GOOGLE_CLIENT_SECRET is required}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:?GOOGLE_REDIRECT_URI is required}
      MOBILE_OAUTH_REDIRECT_URI: ${MOBILE_OAUTH_REDIRECT_URI:-syllo://google-callback}
      BILLING_ENABLED: ${BILLING_ENABLED:-false}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-paddle}
      PADDLE_SANDBOX_ENABLED: ${PADDLE_SANDBOX_ENABLED:-false}
      PADDLE_API_KEY: ${PADDLE_API_KEY:-}
      PADDLE_WEBHOOK_SECRET: ${PADDLE_WEBHOOK_SECRET:-}
      PADDLE_CLIENT_TOKEN: ${PADDLE_CLIENT_TOKEN:-}
      PADDLE_PRICE_SCHOLAR: ${PADDLE_PRICE_SCHOLAR:-}
      PADDLE_PRICE_DEANS_LIST: ${PADDLE_PRICE_DEANS_LIST:-}
      PADDLE_INTRO_DISCOUNT_ID: ${PADDLE_INTRO_DISCOUNT_ID:-}
      ADMIN_BOOTSTRAP_ENABLED: ${ADMIN_BOOTSTRAP_ENABLED:-true}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL is required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD is required}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-5}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-5}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_TLS_ALLOW_LEGACY_CERT: ${DB_TLS_ALLOW_LEGACY_CERT:-true}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      GEMINI_API_KEY: ${GEMINI_API_KEY:?GEMINI_API_KEY is required}
      GEMINI_FRESHMAN_MODEL: ${GEMINI_FRESHMAN_MODEL:-gemini-3.1-flash-lite}
      GEMINI_TUTOR_MODEL: ${GEMINI_TUTOR_MODEL:-gemini-3.8-flash}
      GEMINI_UTILITY_MODEL: ${GEMINI_UTILITY_MODEL:-gemini-3.5-flash-lite}
      GEMINI_TIMEOUT_SECONDS: ${GEMINI_TIMEOUT_SECONDS:-30}
      GEMINI_USER_REQUESTS_PER_MINUTE: ${GEMINI_USER_REQUESTS_PER_MINUTE:-10}
      GEMINI_PROJECT_REQUESTS_PER_MINUTE: ${GEMINI_PROJECT_REQUESTS_PER_MINUTE:-10}
      GEMINI_MONTHLY_BUDGET_CENTS: ${GEMINI_MONTHLY_BUDGET_CENTS:-2500}
      FREE_PLAN_START_CREDITS: ${FREE_PLAN_START_CREDITS:-10}
      FREE_PLAN_MILESTONE_MAX_CREDITS: ${FREE_PLAN_MILESTONE_MAX_CREDITS:-40}
      FREE_PLAN_MAX_CREDITS: ${FREE_PLAN_MAX_CREDITS:-100}
      REFERRAL_BONUS_CREDITS: ${REFERRAL_BONUS_CREDITS:-10}
      REFERRAL_MONTHLY_LIMIT: ${REFERRAL_MONTHLY_LIMIT:-5}
      DEANS_INTRO_MONTHS: ${DEANS_INTRO_MONTHS:-3}
    volumes:
      - type: bind
        source: /data/coolify/ssl/coolify-ca.crt
        target: /etc/ssl/certs/coolify-ca.crt
        read_only: true
        bind:
          create_host_path: false
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=3)"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 5

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    expose:
      - "80"
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/health"]
      interval: 15s
      timeout: 5s
      start_period: 5s
      retries: 5
